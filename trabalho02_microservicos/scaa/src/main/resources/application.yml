server:
  port: 8672
spring:
  application:
    name: scaa
sql:
    init:
        mode: always
        schema-locations: classpath*:/create.sql
        data-locations: classpath*:/insert.sql
        encoding: UTF-8
eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://nameserver:8761/eureka
rabbitmq:
  host: rabbitmq
  port: 5672
  username: user
  password: password